services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: playtest
      POSTGRES_USER: playtest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    volumes:
      - playtest-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playtest"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  playtest-postgres:
